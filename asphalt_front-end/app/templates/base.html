<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Asphalt System" }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">

    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.3.1/ol.css">
    
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/light.css">
    <link rel="stylesheet" href="/static/css/media_queries.css">
    
    <style>
        /* Базовые сбросы для полноэкранного интерфейса */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Чтобы не было прокрутки всей страницы */
            font-family: 'Geologica', sans-serif;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status--transit { background: #e3f2fd; color: #1976d2; }
        .status--idle { background: #f5f5f5; color: #616161; }
        .status--loading { background: #fff3e0; color: #f57c00; }
        .status--alert { background: #ffeae6; color: #ff3b30; }

        /* Обертка для всего контента */
        .main-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="main-wrapper">
        {% block content %}{% endblock %}
    </div>

    <!-- OpenLayers JS -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.3.1/dist/ol.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
