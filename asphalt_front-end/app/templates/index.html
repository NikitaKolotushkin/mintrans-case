<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Asphalt | Dashboard </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.3.1/ol.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<div class="app-wrapper">
    <div id="map"></div>

    <aside class="sidebar">
        <header class="sidebar-header">
            <h2>Asphalt</h2>
        </header>

        <div class="sidebar-content">
            <!-- Кнопки управления -->
            <section class="card">
                <div class="card-title">Управление объектами</div>
                <div class="btn-group">
                    <button class="btn" onclick="ui.add('abz')">АБЗ</button>
                    <button class="btn" onclick="ui.add('section')">УЧАСТОК</button>
                    <button class="btn" onclick="ui.add('truck')">ТЕХНИКА</button>
                </div>
            </section>

            <div id="plants-list"></div>

            <!-- Контейнер для динамических участков из API -->
            <div id="sections-list"></div>

            <!-- Калькулятор -->
            <section class="card">
                <div class="card-title">Автоматический подбор АБЗ</div>
                
                <!-- Выбор участка -->
                <select id="calc-section" class="btn" style="width:100%; margin-bottom:10px; text-align:left;">
                    <option value="">Выберите участок...</option>
                </select>
                
                <input type="number" id="calc-vol" class="btn" style="width:100%; text-align:left; padding-left:15px; margin-bottom:10px;" placeholder="Объем (тонн)" value="450">
                
                <div id="calc-result" style="display:none; background:rgba(37,180,246,0.1); padding:12px; border-radius:8px; text-align:center; margin-bottom:10px;">
                    <!-- Сюда вставим результат -->
                </div>
                
                <button class="btn-primary" onclick="ui.calculateOrder()">НАЙТИ ЗЕЛЕНОЕ ОКНО</button>
            </section>

            <!-- Логистика -->
            <section class="card">
                <div class="card-title">Активные рейсы</div>
                <div id="trucks-container">
                    <div class="truck-card">
                        <div style="display:flex; justify-content:space-between; font-weight:700; font-size:0.8rem;">
                            <span>САМОСВАЛ #045</span>
                            <span style="color:var(--danger);">138°C</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="sidebar-footer">
            <div class="card-title">События</div>
            <div id="event-log"></div>
        </footer>
    </aside>
</div>
<div id="section-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content card">
        <h3>Новый участок дороги</h3>
        <input type="text" id="m-name" placeholder="Название (например, М-11 км 45)" class="btn" style="width:100%; margin-bottom:10px; text-align:left;">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
                <label>Старт (Широта)</label>
                <input type="number" id="m-start-lat" step="0.000001" placeholder="55.123" class="btn" style="width:100%;">
            </div>
            <div>
                <label>Старт (Долгота)</label>
                <input type="number" id="m-start-lon" step="0.000001" placeholder="37.123" class="btn" style="width:100%;">
            </div>
            <div>
                <label>Финиш (Широта)</label>
                <input type="number" id="m-end-lat" step="0.000001" placeholder="56.123" class="btn" style="width:100%;">
            </div>
            <div>
                <label>Финиш (Долгота)</label>
                <input type="number" id="m-end-lon" step="0.000001" placeholder="38.123" class="btn" style="width:100%;">
            </div>
        </div>
        
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn-primary" onclick="ui.saveSection()" style="flex:2;">СОХРАНИТЬ</button>
            <button class="btn" onclick="ui.closeModal()" style="flex:1;">ОТМЕНА</button>
        </div>
    </div>
</div>

<div id="plant-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content card">
        <h3>Новый асфальтобетонный завод (АБЗ)</h3>
        <input type="text" id="p-name" placeholder="Название завода" class="btn" style="width:100%; margin-bottom:10px; text-align:left;">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
            <div>
                <label>Произв-ть (т/ч)</label>
                <input type="number" id="p-capacity" value="160" class="btn" style="width:100%;">
            </div>
            <div>
                <label>Объем бункера (т)</label>
                <input type="number" id="p-bunker" value="500" class="btn" style="width:100%;">
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
                <label>Координата (Широта)</label>
                <input type="number" id="p-lat" step="0.000001" placeholder="55.123" class="btn" style="width:100%;">
            </div>
            <div>
                <label>Координата (Долгота)</label>
                <input type="number" id="p-lon" step="0.000001" placeholder="37.123" class="btn" style="width:100%;">
            </div>
        </div>
        
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn-primary" onclick="ui.savePlant()" style="flex:2;">СОХРАНИТЬ ЗАВОД</button>
            <button class="btn" onclick="ui.closePlantModal()" style="flex:1;">ОТМЕНА</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ol@v10.3.1/dist/ol.js"></script>
<script>
    const OSRM_URL = "https://router.project-osrm.org/route/v1/driving/";

    let globalPlants = [];
    let globalSections = [];
    let lastRouteCoords = null;

    const styles = {
        section: (isActive) => new ol.style.Style({
            stroke: new ol.style.Stroke({
                color: isActive ? '#25B4F6' : '#95a5a6',
                width: 6
            })
        }),

        plant: new ol.style.Style({
            image: new ol.style.Icon({
                anchor: [0.5, 1],
                src: '/static/src/img/factory.png',
                scale: 0.05
            })
        }),

        truck: new ol.style.Style({
            image: new ol.style.Icon({
                anchor: [0.5, 0.5],
                src: '/static/src/img/truck.png',
                scale: 0.05
            })
        })
    };

    const routeSource = new ol.source.Vector();
    const map = new ol.Map({
        target: 'map',
        layers: [
            new ol.layer.Tile({
                source: new ol.source.OSM()
            }),
            new ol.layer.Vector({
                source: routeSource
            })
        ],
        view: new ol.View({
            center: ol.proj.fromLonLat([37.617, 55.755]),
            zoom: 6
        })
    });

    const utils = {
        parseWKT: (wkt) => {
            if (!wkt || typeof wkt !== 'string') return null;
            const res = wkt.match(/POINT\s?\(\s?([\d\.]+)\s+([\d\.]+)\s?\)/i);
            if (!res) return null;

            let val1 = parseFloat(res[1]);
            let val2 = parseFloat(res[2]);


            if (val1 > 50) {
                return [val2, val1];
            } else {
                return [val1, val2];
            }
        },
        fetchRoute: async (start, end) => {
            try {
                const query = `${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`;
                const res = await fetch(OSRM_URL + query);
                const data = await res.json();
                return data.code === 'Ok' ? data.routes[0].geometry.coordinates : null;
            } catch (e) {
                return null;
            }
        }
    };

    const ui = {
        add: (t) => ui.log(`Добавление: ${t}`),
        log: (m) => {
            const log = document.getElementById('event-log');
            if (log) log.insertAdjacentHTML('afterbegin', `<div class="alert-item"><span class="alert-time">${new Date().toLocaleTimeString()}</span> ${m}</div>`);
        },
        renderSection: (s) => {
            const html = `
                        <section class="card">
                            <div class="card-title">${s.name}</div>
                            <div style="font-size:0.7rem; color:${s.is_active ? 'var(--accent)' : '#95a5a6'}">
                                СТАТУС: ${s.is_active ? 'В РАБОТЕ' : 'ЗАВЕРШЕН'}
                            </div>
                        </section>`;
            document.getElementById('sections-list').insertAdjacentHTML('beforeend', html);
        },
        renderTruck: (t) => {
            const html = `
                        <div class="truck-card">
                            <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                                <span>${t.plate_number}</span>
                                <span style="color:var(--accent);">${t.status}</span>
                            </div>
                        </div>`;
            document.getElementById('trucks-container').insertAdjacentHTML('beforeend', html);
        },

        renderPlant: (p) => {
            const html = `
                        <section class="card" style="border-left: 4px solid #2ecc71;">
                            <div class="card-title">АБЗ: ${p.name}</div>
                            <div style="font-size:0.7rem; color:#888;">
                                Мощность: ${p.capacity_per_hour} т/ч | Бункер: ${p.bunker_capacity} т
                            </div>
                        </section>`;
            document.getElementById('plants-list').insertAdjacentHTML('beforeend', html);
        },

        add: (type) => {
            if (type === 'section') {
                document.getElementById('section-modal').style.display = 'flex';
            } else if (type === 'abz') {
                document.getElementById('plant-modal').style.display = 'flex';
            } else {
                ui.log(`Добавление ${type} пока не реализовано`);
            }
        },

        closeModal: () => {
            document.getElementById('section-modal').style.display = 'none';
        },

        closePlantModal: () => {
            document.getElementById('plant-modal').style.display = 'none';
        },

        savePlant: async () => {
            const name = document.getElementById('p-name').value;
            const cap = document.getElementById('p-capacity').value;
            const bunker = document.getElementById('p-bunker').value;
            const lat = document.getElementById('p-lat').value;
            const lon = document.getElementById('p-lon').value;

            if (!name || !lat || !lon) {
                alert("Название и координаты обязательны!");
                return;
            }

            const payload = {
                name: name,
                capacity_per_hour: parseFloat(cap),
                bunker_capacity: parseFloat(bunker),
                location: `POINT(${lon} ${lat})`
            };

            try {
                ui.log("Регистрация АБЗ...");
                const res = await fetch("/api/v1/plants", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    ui.log(`Завод ${name} успешно добавлен!`);
                    ui.closePlantModal();
                    loadData();
                } else {
                    const err = await res.json();
                    ui.log("Ошибка: " + (err.detail || "неизвестная ошибка"));
                }
            } catch (e) {
                ui.log("Ошибка сети: " + e.message);
            }
        },

        saveSection: async () => {
            const name = document.getElementById('m-name').value;
            const sLat = document.getElementById('m-start-lat').value;
            const sLon = document.getElementById('m-start-lon').value;
            const eLat = document.getElementById('m-end-lat').value;
            const eLon = document.getElementById('m-end-lon').value;

            if (!name || !sLat || !sLon || !eLat || !eLon) {
                alert("Заполни все поля!");
                return;
            }

            const payload = {
                name: name,
                start_location: `POINT(${sLon} ${sLat})`,
                end_location: `POINT(${eLon} ${eLat})`,
                is_active: true
            };

            try {
                ui.log("Отправка данных...");
                const res = await fetch("/api/v1/sections", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    ui.log(`Участок ${name} успешно добавлен!`);
                    ui.closeModal();
                    loadData();
                } else {
                    const err = await res.json();
                    ui.log("Ошибка: " + JSON.stringify(err.detail));
                }
            } catch (e) {
                ui.log("Ошибка сети: " + e.message);
            }
        },

        calculateOrder: async () => {
            const sectionId = document.getElementById('calc-section').value;
            const volume = document.getElementById('calc-vol').value;
            const resultDiv = document.getElementById('calc-result');

            if (!sectionId) {
                alert("Выберите участок!");
                return;
            }

            ui.log("Запуск расчета логистики...");
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Считаю оптимальный маршрут...';
            resultDiv.style.background = 'rgba(255,255,255,0.1)';

            try {
                const res = await fetch(`/api/v1/calculate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        section_id: parseInt(sectionId), // Убеждаемся, что это число
                        volume: parseFloat(volume) // Убеждаемся, что это число
                    })
                });
                const data = await res.json();

                if (data.is_possible) {
                    // 1. Выводим текст
                    resultDiv.style.background = 'rgba(46, 204, 113, 0.2)';
                    resultDiv.innerHTML = `
                        <div style="color:#2ecc71; font-weight:bold; margin-bottom:5px;">МОЖНО ВЕЗТИ</div>
                        <div style="font-size:0.9rem;">
                            Завод: <b>${data.optimal_plant_name}</b><br>
                            Температура: <b style="font-size:1.1rem;">${data.arrival_temp}°C</b><br>
                            Путь: ${data.travel_time_min} мин 
                        </div>
                    `;
                    ui.log(`Успех: ${data.optimal_plant_name} подходит (${data.arrival_temp}°C)`);

                    // 2. Отрисовываем маршрут на карте
                    await ui.drawDeliveryRoute(sectionId, data.optimal_plant_id);

                } else {
                    // Выводим причину отказа
                    resultDiv.style.background = 'rgba(231, 76, 60, 0.2)';
                    resultDiv.innerHTML = `
                        <div style="color:#e74c3c; font-weight:bold;">НЕВОЗМОЖНО</div>
                        <div style="font-size:0.8rem;">${data.reason}</div>
                    `;
                    ui.log("Расчет: доставка невозможна.");
                }
            } catch (e) {
                ui.log("Ошибка калькулятора: " + e.message);
                resultDiv.innerHTML = "Ошибка связи с сервером";
            }
        },

        // Метод для отрисовки конкретного маршрута доставки
        drawDeliveryRoute: async (sectionId, plantId) => {
            // Находим данные участка и завода в DOM и глобальных переменных
            const sectionSelect = document.getElementById('calc-section');
            const plant = globalPlants.find(p => p.id === plantId);

            // Нам нужны координаты участка (возьмем из API или найдем в текущем списке)
            const sRes = await fetch("/api/v1/sections");
            const sData = await sRes.json();
            const section = sData.sections.find(s => s.id == sectionId);

            if (!plant || !section) return;

            const startCoords = utils.parseWKT(plant.location);
            const endCoords = utils.parseWKT(section.start_location);

            const routeCoords = await utils.fetchRoute(startCoords, endCoords);
            if (routeCoords) {
                // Очищаем старые маршруты "доставки" (можно создать отдельный слой под них)
                // Но для простоты добавим как яркую синюю линию
                const routeFeature = new ol.Feature({
                    geometry: new ol.geom.LineString(routeCoords.map(c => ol.proj.fromLonLat(c)))
                });

                routeFeature.setStyle(new ol.style.Style({
                    stroke: new ol.style.Stroke({
                        color: '#f1c40f', // Золотой цвет для активного маршрута
                        width: 8,
                        lineDash: [1, 12] // Пунктир для красоты
                    })
                }));

                routeSource.addFeature(routeFeature);

                // Приближаем камеру к маршруту
                map.getView().fit(routeFeature.getGeometry().getExtent(), {
                    padding: [100, 100, 100, 450],
                    duration: 1000
                });
            }
        },
        calculateOrder: async () => {
            const sectionId = document.getElementById('calc-section').value;
            const volume = document.getElementById('calc-vol').value;
            const resultDiv = document.getElementById('calc-result');

            if (!sectionId) return alert("Выберите участок!");

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Подбор логистики...';

            try {
                const res = await fetch(`/api/v1/calculate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        section_id: parseInt(sectionId),
                        volume: parseFloat(volume)
                    })
                });
                const data = await res.json();

                if (data.is_possible) {
                    // Сохраняем данные для анимации
                    const plant = globalPlants.find(p => p.id === data.optimal_plant_id);
                    const sRes = await fetch("/api/v1/sections");
                    const sData = await sRes.json();
                    const section = sData.sections.find(s => s.id == sectionId);

                    // Получаем координаты маршрута для отрисовки и анимации
                    lastRouteCoords = await utils.fetchRoute(
                        utils.parseWKT(plant.location),
                        utils.parseWKT(section.start_location)
                    );

                    if (lastRouteCoords) {
                        ui.drawStaticRoute(lastRouteCoords);
                    }

                    resultDiv.style.background = 'rgba(46, 204, 113, 0.2)';
                    resultDiv.innerHTML = `
                        <div style="color:#2ecc71; font-weight:bold; margin-bottom:5px;">МОЖНО ВЕЗТИ</div>
                        <div style="font-size:0.85rem; margin-bottom:10px; text-align:left;">
                            Завод: <b>${data.optimal_plant_name}</b><br>
                            Температура: <b>${data.arrival_temp}°C</b><br>
                            Путь: <b>${data.travel_time_min} мин</b> (${data.distance_km || '—'} км)
                        </div>
                        <button class="btn-primary" style="width:100%;" onclick="ui.startTruckAnimation()">ОТПРАВИТЬ РЕЙС</button>
                    `;
                } else {
                    resultDiv.style.background = 'rgba(231, 76, 60, 0.2)';
                    resultDiv.innerHTML = `<div style="color:#e74c3c;">${data.reason}</div>`;
                }
            } catch (e) {
                ui.log("Ошибка: " + e.message);
            }
        },

        // Отрисовка линии маршрута (пунктир)
        drawStaticRoute: (coords) => {
            const line = new ol.geom.LineString(coords.map(c => ol.proj.fromLonLat(c)));
            const feature = new ol.Feature({
                geometry: line
            });
            feature.setStyle(new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: '#f1c40f',
                    width: 4,
                    lineDash: [1, 10]
                })
            }));
            routeSource.addFeature(feature);
            map.getView().fit(line.getExtent(), {
                padding: [50, 50, 50, 450],
                duration: 1000
            });
        },

        // АНИМАЦИЯ ГРУЗОВИКА
        startTruckAnimation: () => {
            if (!lastRouteCoords) return;

            ui.log("Грузовик выехал с АБЗ...");

            const line = new ol.geom.LineString(lastRouteCoords.map(c => ol.proj.fromLonLat(c)));
            const truckFeature = new ol.Feature({
                geometry: new ol.geom.Point(line.getFirstCoordinate())
            });
            truckFeature.setStyle(styles.truck);
            routeSource.addFeature(truckFeature);

            let progress = 0;
            const speed = 0.003; // Скорость движения

            function animate() {
                progress += speed;
                if (progress <= 1) {
                    const currentPoint = line.getCoordinateAt(progress);
                    truckFeature.getGeometry().setCoordinates(currentPoint);

                    // Поворот кабины по вектору движения
                    const nextPoint = line.getCoordinateAt(Math.min(progress + 0.01, 1));
                    const rotation = Math.atan2(nextPoint[1] - currentPoint[1], nextPoint[0] - currentPoint[0]);
                    truckFeature.getStyle().getImage().setRotation(-rotation + Math.PI / 2);

                    requestAnimationFrame(animate);
                } else {
                    ui.log("Грузовик прибыл! Начинаем укладку.");
                    setTimeout(() => routeSource.removeFeature(truckFeature), 2000);
                }
            }
            animate();
        }
    };

    async function loadData() {
        ui.log("Система инициализирована. Загрузка данных...");
        routeSource.clear();
        document.getElementById('sections-list').innerHTML = '';
        document.getElementById('trucks-container').innerHTML = '';

        try {
            const sRes = await fetch("/api/v1/sections");
            const sData = await sRes.json();

            const select = document.getElementById('calc-section');
            select.innerHTML = '<option value="">Выберите участок...</option>';

            for (const s of sData.sections || []) {
                ui.renderSection(s);
                const start = utils.parseWKT(s.start_location);
                const end = utils.parseWKT(s.end_location);
                if (start && end) {
                    let coords = await utils.fetchRoute(start, end);
                    if (!coords) coords = [start, end];

                    const feat = new ol.Feature({
                        geometry: new ol.geom.LineString(coords.map(c => ol.proj.fromLonLat(c)))
                    });
                    feat.setStyle(styles.section(s.is_active));
                    routeSource.addFeature(feat);
                }
                select.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}</option>`);
            }

            const tRes = await fetch("/api/v1/trucks");
            const tData = await tRes.json();

            tData.trucks?.forEach(t => {
                ui.renderTruck(t);
                if (t.current_location) {
                    const coords = utils.parseWKT(t.current_location);
                    if (coords) {
                        const feat = new ol.Feature({
                            geometry: new ol.geom.Point(ol.proj.fromLonLat(coords))
                        });
                        feat.setStyle(styles.truck);
                        routeSource.addFeature(feat);
                    }
                }
            });

            const pRes = await fetch("/api/v1/plants");
            const pData = await pRes.json();

            document.getElementById('plants-list').innerHTML = '';

            if (pData.plants) {
                globalPlants = pData.plants; 

                pData.plants.forEach(p => {
                    ui.renderPlant(p);

                    const coords = utils.parseWKT(p.location);
                    if (coords) {
                        const feat = new ol.Feature({
                            geometry: new ol.geom.Point(ol.proj.fromLonLat(coords))
                        });
                        feat.setStyle(styles.plant);
                        routeSource.addFeature(feat);
                        ui.log(`Завод ${p.name} отрисован`);
                    } else {
                        console.error("Не удалось распарсить координаты завода:", p.name, p.location);
                    }
                });
            }

            if (pData.plants) {
                globalPlants = pData.plants; 

                pData.plants.forEach(p => {
                    ui.renderPlant(p);
                    // ... остальной код отрисовки на карте ...
                    const coords = utils.parseWKT(p.location);
                    if (coords) {
                        const feat = new ol.Feature({
                            geometry: new ol.geom.Point(ol.proj.fromLonLat(coords))
                        });
                        feat.setStyle(styles.plant);
                        routeSource.addFeature(feat);
                    }
                });
            }

            if (routeSource.getFeatures().length > 0) {
                map.getView().fit(routeSource.getExtent(), {
                    padding: [50, 50, 50, 420],
                    duration: 1000
                });
            }
        } catch (err) {
            ui.log("Ошибка API: " + err.message);
        }
    }

    window.onload = loadData;
</script>
</body>
</html>
