server {
    listen 80;
    server_name localhost 127.0.0.1;

    location /api/ {
        include conf.d/proxy_params;

        proxy_pass http://edge-router:8080;
        proxy_pass_header Set-Cookie;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Cookie $http_cookie;

        proxy_cookie_path ~^/.* /;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
    
    location = /session-check {
        include conf.d/proxy_params;

        proxy_pass http://edge-router:8080/api/session;
        proxy_pass_header Set-Cookie;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;

        proxy_cache_bypass $http_cookie;
        proxy_no_cache 1;
        proxy_set_header Cache-Control "no-store";
    }

    location / {
        include conf.d/proxy_params;

        proxy_pass http://front-end:8081;
        proxy_pass_header Set-Cookie;
    }
}

server {
    listen 80;
    server_name mintrans-case.ru www.mintrans-case.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mintrans-case.ru www.mintrans-case.ru;

    ssl_certificate /etc/nginx/ssl/mintrans-case.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mintrans-case.ru/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location /api/ {
        include conf.d/proxy_params;

        proxy_pass http://edge-router:8080;
        proxy_pass_header Set-Cookie;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Cookie $http_cookie;

        proxy_cookie_path ~^/.* /;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;

    }
    
    location = /session-check {
        include conf.d/proxy_params;

        proxy_pass http://edge-router:8080/api/session;
        proxy_pass_header Set-Cookie;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;

        proxy_cache_bypass $http_cookie;
        proxy_no_cache 1;
        proxy_set_header Cache-Control "no-store";
    }

    location / {
        include conf.d/proxy_params;

        proxy_pass http://front-end:8081;
        proxy_pass_header Set-Cookie;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/fake-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/fake-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}
